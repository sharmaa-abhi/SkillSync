# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# This workflow will install Deno then run `deno test`.
# For more information see: https://github.com/denoland/setup-deno

name: Deno

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Setup repo
        uses: actions/checkout@v4

      - name: Setup Deno
        # uses: denoland/setup-deno@v1
        uses: denoland/setup-deno@61fe2df320078202e33d7d5ad347e7dcfa0e8f31  # v1.1.2
        with:
          deno-version: v1.x

      # Uncomment this step to verify the use of 'deno fmt' on each commit.
      # - name: Verify formatting
      #   run: deno fmt --check

      - name: Run tests
        run: |
          deno_test_files=$(git ls-files '*_test.ts' '*_test.tsx' '*_test.js' '*_test.jsx' '*_test.mjs' '*_test.mts' '*_test.cjs' '*_test.cts' '*.test.ts' '*.test.tsx' '*.test.js' '*.test.jsx' '*.test.mjs' '*.test.mts' '*.test.cjs' '*.test.cts' '*.spec.ts' '*.spec.tsx' '*.spec.js' '*.spec.jsx' '*.spec.mjs' '*.spec.mts' '*.spec.cjs' '*.spec.cts')
          if [ -z "$deno_test_files" ]; then
            echo "No Deno test modules found. Skipping deno test."
            exit 0
          fi
          deno test -A $deno_test_files
